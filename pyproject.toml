[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-product-intelligence"
version = "1.0.0"
description = "Multi-agent product intelligence system using Amazon Bedrock to analyze marketplace products, reviews, ratings, and prices with FinOps cost tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "selenium>=4.20",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/product_intelligence"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
